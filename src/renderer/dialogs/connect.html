<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>Connect to Network</title>
    <link rel="stylesheet" href="../../renderer/styles/index.css" />
    <!-- <link rel="stylesheet" href="../assets/css/semantic.min.css" /> -->
</head>
<body>

    <form id="connection_form">
        <div class="connect">
            <h1>Connect to a server</h1>
            <label class="label" for="connection_type">Connection type</label>
            <select id="connection_type" class="input select">
                <option value="ssh">SFTP (over SSH)</option>
                <option value="smb">Windows Share (SMB)</option>
                <option value="ftp">FTP</option>
                <option value="nfs">NFS</option>
                <option value="davs">WebDAV (HTTPS)</option>
                <option value="dav">WebDAV (HTTP)</option>
            </select>
            <label class="label" for="txt_server">Server / Share</label>
            <input class="input" type="text" id="txt_server" required autocomplete="off" aria-describedby="protocol_help">
            <p id="protocol_help"></p>
            <div id="username_fields">
                <label class="label" for="txt_username">Username</label>
                <input class="input" type="text" id="txt_username" autocomplete="username">
            </div>
            <div id="password_fields">
                <label class="label" for="txt_password">Password</label>
                <input class="input" type="password" id="txt_password" autocomplete="current-password">
            </div>
            <div class="chk_div" id="key_fields">
                <input id="chk_pk" type="checkbox" checked disabled>
                <label for="chk_pk">Use SSH key authentication</label>
            </div>
            <div class="chk_div">
                <input type="checkbox" id="chk_save_connection" checked>
                <label for="chk_save_connection">Save connection</label>
            </div>
            <div class="chk_div">
                <input type="checkbox" id="chk_auto_reconnect">
                <label for="chk_auto_reconnect">Reconnect automatically after startup</label>
            </div>
            <div class="msg_connect" id="connect_msg" role="status" aria-live="polite" aria-atomic="true"></div>
            <div class="connection_actions">
                <input class="button button-dialog" id="button_close" type="button" value="Close">
                <input class="button button-dialog" id="button_cancel" type="button" value="Cancel" hidden>
                <input class="button button-dialog" id="button_connect" type="submit" value="Connect">
            </div>
        </div>
    </form>
</body>
</html>
