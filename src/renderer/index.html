<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <title></title>
        <link rel="stylesheet" href="styles/index.css">
        <link rel="stylesheet" href="../assets/bootstrap-icons/font/bootstrap-icons.css">
        <link rel="stylesheet" href="styles/titlebar.css">
        <!-- <link rel="stylesheet" href="../../node_modules/material-design-icons/iconfont/material-icons.css"> -->
    </head>
    <body>

        <div class="titlebar">
            <div class="titlebar-menu">
                <div class="menu-item" tabindex="0">File
                    <div class="menu-dropdown">
                        <div class="menu-dropdown-item" data-action="new-window">New Window</div>
                        <div class="menu-dropdown-item" data-action="open">Open...</div>
                        <div class="menu-dropdown-item" data-action="save">Save</div>
                        <div class="menu-dropdown-item" data-action="exit">Exit</div>
                    </div>
                </div>
                <div class="menu-item" tabindex="0">Edit
                    <div class="menu-dropdown">
                        <div class="menu-dropdown-item" data-action="undo">Undo</div>
                        <div class="menu-dropdown-item" data-action="redo">Redo</div>
                        <div class="menu-dropdown-item" data-action="cut">Cut</div>
                        <div class="menu-dropdown-item" data-action="copy">Copy</div>
                        <div class="menu-dropdown-item" data-action="paste">Paste</div>
                    </div>
                </div>
                <div class="menu-item" tabindex="0">View
                    <div class="menu-dropdown">
                        <div class="menu-dropdown-item" data-action="reload">Reload</div>
                        <div class="menu-dropdown-item" data-action="toggle-devtools">Toggle Developer Tools</div>
                        <div class="menu-dropdown-item" data-action="fullscreen">Toggle Full Screen</div>
                    </div>
                </div>
                <div class="menu-item" tabindex="0">Help
                    <div class="menu-dropdown">
                        <div class="menu-dropdown-item" data-action="about">About</div>
                    </div>
                </div>
            </div>
            <div class="titlebar-drag"></div>
            <div class="titlebar-title"></div>
            <div class="titlebar-controls">
                <button class="titlebar-btn titlebar-min" title="Minimize">&#x2013;</button>
                <button class="titlebar-btn titlebar-max" title="Maximize">&#x25A1;</button>
                <button class="titlebar-btn titlebar-close" title="Close">&#x2715;</button>
            </div>
        </div>
        <script src="titlebar.js"></script>

        <div class="menu">
            <div class="nav_header hidden">
                <button class="button new folder"><i class="bi bi-folder-plus"></i></button>
                <button class="button cut"><i class="bi bi-scissors"></i></button>
                <button class="button copy"><i class="bi bi-copy"></i></button>
                <button class="button paste"><i class="bi bi-clipboard-check"></i></button>
                <button class="button delete"><i class="bi bi-trash"></i></button>

                <button class="button settings"><i class="bi bi-sliders right"></i></button>

            </div>
            <div class="navigation">
                <button id="btn_back" class="back button"><i class="bi bi-chevron-left"></i></button>
                <button id="btn_forward" class="forward button"><i class="bi bi-chevron-right"></i></button>
                <div class="breadcrumbs"></div>
                <input type="text" spellcheck="false" class="location hidden"></input>
                <div class="filter" contenteditable="true"></div>
                <div class="find_menu">
                    <button class="button find" type="button" title="Find">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <input type="text" class="placeholder" style="width: 0; position: absolute; z-index: -1;"></input>
                <div class="disk_space"></div>
                <div class="settings_menu">
                    <div class="button settings" title="Settings">
                        <i class="bi bi-gear"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Keep the selection rectangle outside of container for now -->
        <div class="selection-rectangle"></div>

        <div class="container">
            <div class="sidebar"></div>
            <div class="sidebar_draghandle"></div>
            <div class="context_menu"></div>

            <div class="tab-header"></div>

            <div class="main"></div>
            <div class="sentinel"></div>
            <div class="footer">
                <div class="msg"></div>
                <div class="progress hidden">
                    <div class="progress_status"></div>
                    <progress class="progress_bar" value="0" max="100"></progress>
                    <button class="progress_cancel hidden" type="button">Cancel</button>
                </div>
                <div class="zoom_controls">
                    <!-- <button id="btn_zoom_out" class="button"><i class="bi bi-dash"></i></button>
                    <button id="btn_zoom_in" class="button"><i class="bi bi-plus"></i></button> -->
                </div>

            </div>
        </div>
        <!-- About Dialog -->
        <div id="about-dialog" class="about-dialog hidden">
            <div class="about-dialog-content">
                <!-- <div class="about-dialog-title">About SFM</div> -->
                <div class="about-dialog-body">
                    <div id="about-app-name" style="font-size:1.2em;font-weight:bold;margin-bottom:2px;"></div>
                    <div id="about-app-description" style="color:#bbb;font-size:0.98em;margin-bottom:10px;"></div>
                    <div id="about-app-version" style="margin-bottom:2px;"></div>
                    <div id="about-electron-version" style="margin-bottom:10px;"></div>
                    <div style="margin-bottom:6px;">© 2026 Michael Vanderford</div>
                    <div style="margin-bottom:6px;"><a href="https://github.com/michael-vanderford/sfm" target="_blank" style="color:#8cf;text-decoration:underline;">Project Homepage</a></div>
                    <div style="color:#aaa;">Licensed under LGPL-2.1-or-later</div>
                </div>
                <div class="about-dialog-footer">
                    <button id="about-dialog-close" class="about-dialog-close-btn">Close</button>
                </div>
            </div>
        </div>
    </body>
</html>
